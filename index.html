<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>예산과 작업기록 · 글봄</title><link rel="stylesheet" href="style.css"></head><body>
<header><small>GEULBOM LAB</small><h1>예산과 작업기록</h1><p>지원사업의 지출과 작업 과정을 한곳에.</p><div class="actions"><button id="backup">백업 저장</button><button id="restore">백업 불러오기</button><button id="print">인쇄 / PDF</button><input hidden id="file" type="file" accept=".json"></div></header>
<main><section><h2>프로젝트</h2><form id="settings"><label>프로젝트명<input name="name" required maxlength="150"></label><label>총예산 (원)<input name="budget" type="number" min="0" step="1" required></label><button>설정 저장</button></form><div class="stats"><div>지출 <strong id="spent">0원</strong></div><div>남은 예산 <strong id="remaining">0원</strong></div><div>증빙 미확인 <strong id="missing">0건</strong></div></div><p class="note">지출 합계를 관리하는 템플릿입니다. 비용 인정 여부와 한도는 해당 지원사업 지침을 확인하세요.</p></section>
<section><h2>지출 기록</h2><form id="expense"><input type="hidden" name="id"><div class="grid"><label>날짜<input type="date" name="date" required></label><label>분류<select name="category"><option>도구·구독</option><option>자료·제작</option><option>회의·식비</option><option>교통</option><option>기타</option></select></label><label>사용처<input name="vendor" required maxlength="200"></label><label>금액 (원)<input name="amount" type="number" min="0" step="1" required></label></div><label>사용 목적<textarea name="purpose" required maxlength="3000"></textarea></label><label>증빙 파일명·보관 위치<input name="evidence" maxlength="1000" placeholder="예: 영수증_1104.pdf / 개인 증빙 폴더"></label><label class="check"><input type="checkbox" name="confirmed">영수증·활동증빙 확인 완료</label><div class="actions"><button>지출 저장</button><button type="button" id="new-expense">새 기록</button><button type="button" id="csv">CSV 내려받기</button></div></form><div id="expenses"></div></section>
<section><h2>작업일지</h2><form id="journal"><input type="hidden" name="id"><div class="grid"><label>날짜<input name="date" type="date" required></label><label>작업시간<input name="time" maxlength="100" placeholder="예: 14:00–16:00"></label></div><label>목표<input name="goal" required maxlength="300"></label><label>실제로 한 일<textarea name="work" required maxlength="10000"></textarea></label><label>결과와 다음 할 일<textarea name="result" maxlength="10000"></textarea></label><label>증빙 파일명·보관 위치<input name="evidence" maxlength="1000"></label><div class="actions"><button>일지 저장</button><button type="button" id="new-journal">새 일지</button></div></form><div id="journals"></div></section></main>
<footer>기록은 이 브라우저에 저장됩니다. 다른 기기로 옮기거나 브라우저 데이터를 지우기 전 백업하세요. 증빙 파일 자체는 첨부·저장하지 않습니다.</footer><p id="status" role="status"></p><script src="core.js"></script><script src="app.js"></script></body></html>
